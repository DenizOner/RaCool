# Example only: choose the real device MQTT set topic and temperature entity.
# The firmware stores slot values in RAM and knows no Home Assistant entity IDs.
alias: RaCool harici sıcaklık heartbeat
triggers:
  - trigger: state
    entity_id: sensor.room_temperature
  - trigger: time_pattern
    minutes: "/5"
  - trigger: homeassistant
    event: start
conditions:
  - condition: template
    value_template: >-
      {{ is_number(states('sensor.room_temperature')) and
         -50 <= states('sensor.room_temperature') | float <= 200 }}
actions:
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/YOUR_RACOOL/set
      retain: false
      payload: >-
        {{ {'external_temperature_1_climate': states('sensor.room_temperature') | float} | to_json }}
mode: single
