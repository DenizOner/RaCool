[platformio]
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
platform = espressif32@6.9.0
board = esp32-c6-devkitc-1
framework = espidf
board_build.cmake_extra_args = -DRACOOL_LED_PHASE_DIAGNOSTIC=OFF -DRACOOL_ZIGBEE_REPORT_DIAGNOSTIC=OFF -DRACOOL_ZIGBEE_REPORT_LEGACY_CONTEXT_DIAGNOSTIC=OFF
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
debug_tool = esp-builtin

monitor_filters = direct, esp32_exception_decoder
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
upload_protocol = esptool
board_build.flash_mode = dio
board_build.f_flash = 80000000L
lib_deps =
    lvgl/lvgl@9.6.0

# Dependencies are explicitly declared below and by ESP-IDF CMake components.
lib_ldf_mode = off
extra_scripts =
    pre:tools/platformio_manifest.py
    post:tools/platformio_link.py
build_flags =
    -I "${PROJECT_DIR}/include"
    -I "${PROJECT_DIR}/src"
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_ZIGBEE_ENABLE=1
    -DCONFIG_ZIGBEE_TX_POWER=10
    -DRACOOL_TARGET_MONITOR=1
    -DCONFIG_TEMP_SENSOR_SKIP_LEGACY_CONFLICT_CHECK=1
    -DCONFIG_TEMP_SENSOR_SUPPRESS_DEPRECATE_WARN=1
    -D LV_CONF_PATH="\"lv_conf.h\""
    -D LV_USE_DRAW_SW_ASM_HELIUM=0
    -D LV_USE_DRAW_SW_ASM_NEON=0
    -I lib

check_skip_packages = yes
check_flags =
    cppcheck: --suppress=unusedFunction

# Partition table is handled by partitions.csv.

upload_speed = 115200

[env:esp32-c6-devkitc-1_test]
platform = espressif32@6.9.0
board = esp32-c6-devkitc-1
framework = espidf
test_framework = unity
# Use the ESP-IDF Unity component; do not link a second Unity implementation.
lib_ignore = Unity
test_filter =
    test_target_smoke
    test_target_rgb
test_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_protocol = esptool
monitor_filters = direct, esp32_exception_decoder
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.flash_mode = dio
board_build.f_flash = 80000000L
upload_speed = 460800
build_flags =
    -I "${PROJECT_DIR}/include"
    -I "${PROJECT_DIR}/src"
    -I "${PROJECT_DIR}/test/Infrastructure/support"
    -D CORE_DEBUG_LEVEL=5
    -D CONFIG_ZIGBEE_ENABLE=1
    -D CONFIG_ZIGBEE_TX_POWER=10
    -DCONFIG_TEMP_SENSOR_SKIP_LEGACY_CONFLICT_CHECK=1
    -DCONFIG_TEMP_SENSOR_SUPPRESS_DEPRECATE_WARN=1
    -D LV_CONF_PATH="\"lv_conf.h\""
    -D LV_USE_DRAW_SW_ASM_HELIUM=0
    -D LV_USE_DRAW_SW_ASM_NEON=0
    -I lib
    -D UNITY_OUTPUT_FORMAT=UNITY_FORMAT_LEGACY
    -D RACOOL_TARGET_TESTING
    -Wl,-z,noexecstack
lib_deps =
    lvgl/lvgl@9.6.0
extra_scripts =
    pre:tools/platformio_manifest.py
    post:tools/platformio_link.py
# Dependencies are explicitly declared below and by ESP-IDF CMake components.
lib_ldf_mode = off

[env:native]
# NOTE: PlatformIO 6.x native runner does not discover test/Hardware/* sub-directories.
# Use test/run_native_tests.ps1 to build and run native tests with gcc directly.
# This env block remains for reference and future IDE integration.
platform = native
test_framework = unity
build_flags =
    -I include
    -I src
    -I test/Infrastructure/mocks
    -I test/Infrastructure/mocks/driver
    -I test/Infrastructure/mocks/freertos
    -I test/Infrastructure/mocks/esp_common
    -I test/Infrastructure/support
    -include test/Infrastructure/support/test_mocks.h
    -D CORE_DEBUG_LEVEL=5
    -D UNITY_OUTPUT_FORMAT=UNITY_FORMAT_LEGACY
    -D RACOOL_TEST_NATIVE
    -D_GNU_SOURCE
    -g
lib_deps =
    throwtheswitch/Unity@^2.6.0

# Temporary diagnostic image; restore the production environment after capture.
[env:esp32-c6-i2c-trace]
extends = env:esp32-c6-devkitc-1
board_build.cmake_extra_args = -DRACOOL_I2C_WAIT_TRACE=ON

# Temporary real health-producer diagnostic; restore production after verification.
[env:esp32-c6-health-report]
extends = env:esp32-c6-devkitc-1
board_build.cmake_extra_args = -DRACOOL_HEALTH_REPORT_DIAGNOSTIC=ON

# Temporary startup wire probe; local sensing and safety remain active.
[env:esp32-c6-startup-sentinel]
extends = env:esp32-c6-devkitc-1
board_build.cmake_extra_args = -DRACOOL_STARTUP_SENTINEL_DIAGNOSTIC=ON

# Temporary splash-pixel capture; always restore the production environment.
[env:esp32-c6-boot-frame]
extends = env:esp32-c6-devkitc-1
board_build.cmake_extra_args = -DRACOOL_BOOT_FRAME_DIAGNOSTIC=ON

# Temporary SDK report-path instrumentation; always restore production afterwards.
[env:esp32-c6-zigbee-report-trace]
extends = env:esp32-c6-devkitc-1
board_build.cmake_extra_args = -DRACOOL_ZIGBEE_REPORT_DIAGNOSTIC=ON
