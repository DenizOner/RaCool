name: RaCool CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RACOOL_PYTHON: python

jobs:
  build-and-native-tests:
    name: Firmware Build & Host Native Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (for asset & font generators)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache PlatformIO Core and Packages
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-firmware-${{ runner.os }}-${{ hashFiles('platformio.ini', 'idf_component.yml') }}
          restore-keys: |
            pio-firmware-${{ runner.os }}-

      - name: Build Firmware (Production ESP32-C6)
        run: pio run -e esp32-c6-devkitc-1

      - name: Install Native Test Dependencies
        run: pio pkg install -e native

      - name: Run Host Native Unit Tests (86 suites, 1540 cases)
        run: node test/run_native_tests.mjs

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: racool-firmware-esp32-c6
          retention-days: 14
          path: |
            .pio/build/esp32-c6-devkitc-1/firmware.bin
            .pio/build/esp32-c6-devkitc-1/bootloader.bin
            .pio/build/esp32-c6-devkitc-1/partitions.bin
          if-no-files-found: error

      - name: Upload Managed Dependencies (for Helper Suites)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: managed-dependencies
          path: |
            managed_components/
            .pio/libdeps/esp32-c6-devkitc-1/lvgl/
          retention-days: 1
          if-no-files-found: error

  layout-and-helpers:
    name: Layout & Helper Suites (Windows)
    needs: build-and-native-tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Managed Dependencies
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: managed-dependencies

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Test Layout
        run: node test/check_test_layout.mjs

      - name: Verify Test Inventory
        run: node test/check_test_inventory.mjs

      - name: Run Helper Test Suites (82 suites, 406 cases)
        run: node test/run_helper_tests.mjs
