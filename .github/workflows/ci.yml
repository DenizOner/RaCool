name: RaCool CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RACOOL_PYTHON: python

jobs:
  build-and-native-tests:
    name: Firmware Build & Host Native Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js (for asset & font generators)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache PlatformIO Core and Packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-firmware-${{ runner.os }}-${{ hashFiles('platformio.ini', 'idf_component.yml') }}
          restore-keys: |
            pio-firmware-${{ runner.os }}-

      - name: Build Firmware (Production ESP32-C6)
        run: pio run -e esp32-c6-devkitc-1

      - name: Verify Compiled ESP32-C6 App Identity and OTA Slot (read-only)
        run: python tools/ota/check_compiled_candidate.py --firmware .pio/build/esp32-c6-devkitc-1/firmware.bin

      - name: Install Native Test Dependencies
        run: pio pkg install -e native

      - name: Run Host Native Unit Tests (86 suites, 1540 cases)
        run: node test/run_native_tests.mjs

      - name: Verify Pillow 10.4.0 minimum with OLED PNG roundtrip
        run: |
          python -m pip install --no-deps --force-reinstall Pillow==10.4.0
          python -c "import PIL; assert PIL.__version__ == '10.4.0', PIL.__version__"
          python test/Hardware/OLED/test_frame_evidence.py

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: racool-firmware-esp32-c6
          retention-days: 14
          path: |
            .pio/build/esp32-c6-devkitc-1/firmware.bin
            .pio/build/esp32-c6-devkitc-1/bootloader.bin
            .pio/build/esp32-c6-devkitc-1/partitions.bin
          if-no-files-found: error

      - name: Upload Managed Dependencies (for Helper Suites)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: managed-dependencies
          path: |
            managed_components/
            .pio/libdeps/esp32-c6-devkitc-1/lvgl/
          retention-days: 1
          if-no-files-found: error

  layout-and-helpers:
    name: Layout & Helper Suites (Windows)
    needs: build-and-native-tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Managed Dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: managed-dependencies

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Test Layout
        run: node test/check_test_layout.mjs

      - name: Verify Test Inventory
        run: node test/check_test_inventory.mjs

      - name: Run Helper Test Suites (82 suites, 407 cases)
        run: node test/run_helper_tests.mjs

      - name: Verify Pillow 10.4.0 minimum with OLED PNG roundtrip
        run: |
          python -m pip install --no-deps --force-reinstall Pillow==10.4.0
          python -c "import PIL; assert PIL.__version__ == '10.4.0', PIL.__version__"
          python test/Hardware/OLED/test_frame_evidence.py
